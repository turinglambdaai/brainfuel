name: release

# Release model:
# - portable ZIPs remain available for users who do not want an installation;
# - Windows gets a branded one-click Setup, an optional MSI, full/delta update packages and feed;
# - every binary artifact receives a GitHub/Sigstore build-provenance attestation;
# - the final release contains a verified SHA256SUMS manifest;
# - one final job publishes the GitHub Release only after all verification passes;
# - nothing is packaged before the test suite passes on Linux and Windows;
# - Windows binaries are Authenticode-signed via Azure Artifact Signing when the
#   six AZURE_* repository variables are configured (see docs/WINDOWS_SIGNING.md),
#   and ship unsigned with checksums otherwise.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to package, for example 0.4.0 (must match BrainFuel.csproj)'
        required: false
        type: string
      publish:
        description: 'Publish a GitHub Release and create the v<version> tag'
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and validate release version
        id: release
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          project_version="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' BrainFuel.csproj | head -n1)"
          if [[ -z "$project_version" ]]; then
            echo 'Unable to read <Version> from BrainFuel.csproj' >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            publish=true
          else
            version="${REQUESTED_VERSION#v}"
            if [[ -z "$version" ]]; then version="$project_version"; fi
            publish="${REQUESTED_PUBLISH:-false}"
          fi
          if [[ "$version" != "$project_version" ]]; then
            echo "Requested/tag version $version does not match BrainFuel.csproj version $project_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "Release version: $version; publish: $publish"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build BrainFuel.Tests/BrainFuel.Tests.csproj -c Release
      - name: Test
        run: dotnet test BrainFuel.Tests/BrainFuel.Tests.csproj -c Release --no-build

  portable:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, platform: windows-x64 }
          - { rid: osx-arm64, platform: macos-arm64 }
          - { rid: linux-x64, platform: linux-x64 }
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Publish portable (${{ matrix.rid }})
        run: >-
          dotnet publish BrainFuel.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:Version=${{ needs.prepare.outputs.version }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -o publish
      - name: Package portable ZIP
        working-directory: publish
        run: zip -r "BrainFuel-${{ matrix.platform }}.zip" . -x '*.pdb'
      - name: Free disk space before Debian packaging
        if: matrix.rid == 'linux-x64'
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet/sdk/8.* || true
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /

      - name: Build Debian package
        if: matrix.rid == 'linux-x64'
        # The dpkg-deb tar|compressor pipeline fails intermittently on hosted
        # runners (tar: stdout: write error) regardless of codec; a rerun of
        # the failed job passes. Keep the step retriable rather than adding
        # workarounds.
        run: bash packaging/linux/build-deb.sh "${{ needs.prepare.outputs.version }}" dist/deb

      - name: Install and remove Debian package
        if: matrix.rid == 'linux-x64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/deb/BrainFuel-linux-x64.deb
          test -x /opt/brainfuel/BrainFuel
          test -L /usr/bin/brainfuel
          test -f /usr/share/applications/brainfuel.desktop
          sudo apt-get remove -y brainfuel

      - name: Attest portable build provenance
        uses: actions/attest@v4
        with:
          subject-path: publish/BrainFuel-${{ matrix.platform }}.zip

      - name: Attest Debian package
        if: matrix.rid == 'linux-x64'
        uses: actions/attest@v4
        with:
          subject-path: dist/deb/BrainFuel-linux-x64.deb

      - name: Upload Debian package
        if: matrix.rid == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-deb
          path: |
            dist/deb/BrainFuel-linux-x64.deb
            dist/deb/BrainFuel-linux-x64.deb.sha256
          if-no-files-found: error
      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-portable-${{ matrix.platform }}
          path: publish/BrainFuel-${{ matrix.platform }}.zip
          if-no-files-found: error

  macos-native:
    needs: [prepare, test]
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build app bundle and DMG
        run: bash packaging/macos/build-native.sh "${{ needs.prepare.outputs.version }}" dist/native
      - name: Verify DMG contents
        run: |
          hdiutil attach dist/native/BrainFuel-macos-arm64.dmg -mountpoint /tmp/dmg-verify -nobrowse -readonly
          test -x /tmp/dmg-verify/BrainFuel.app/Contents/MacOS/BrainFuel
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' /tmp/dmg-verify/BrainFuel.app/Contents/Info.plist | grep -qx "${{ needs.prepare.outputs.version }}"
          plutil -lint /tmp/dmg-verify/BrainFuel.app/Contents/Info.plist
          hdiutil detach /tmp/dmg-verify
      - name: Attest native macOS build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/native/BrainFuel-macos-arm64.dmg
            dist/native/BrainFuel-macos-arm64.app.zip
      - name: Upload native macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-macos-native
          path: |
            dist/native/BrainFuel-macos-arm64.dmg
            dist/native/BrainFuel-macos-arm64.app.zip
          if-no-files-found: error

  windows-updater:
    needs: [prepare, test]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Resolve Windows signing mode
        id: signing-mode
        shell: pwsh
        run: |
          $required = @(
            $env:AZURE_CLIENT_ID,
            $env:AZURE_TENANT_ID,
            $env:AZURE_SUBSCRIPTION_ID,
            $env:ARTIFACT_SIGNING_ENDPOINT,
            $env:ARTIFACT_SIGNING_ACCOUNT,
            $env:ARTIFACT_SIGNING_PROFILE
          )
          $present = @($required | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($present -eq 0) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Warning 'Azure Artifact Signing is not configured. Publishing unsigned Windows binaries with checksums and attestations.'
          } elseif ($present -ne $required.Count) {
            throw 'Azure Artifact Signing is only partially configured. Configure all six repository variables or remove them all.'
          } else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host 'Azure Artifact Signing configuration detected; Windows binaries will be signed.'
          }
      - name: Publish multi-file payload for the pack phase
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: ./installer/build-velopack.ps1 -Version $env:BUILD_VERSION -Phase publish
      - name: Azure login with GitHub OIDC
        if: steps.signing-mode.outputs.enabled == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign BrainFuel.exe with Azure Artifact Signing
        if: steps.signing-mode.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\publish\velopack-win-x64\BrainFuel.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: BrainFuel
          description-url: https://brainfuel.jrtx.site/
      - name: Verify application Authenticode signature
        if: steps.signing-mode.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $path = Join-Path $pwd 'publish\velopack-win-x64\BrainFuel.exe'
          $signature = Get-AuthenticodeSignature $path
          if ($signature.Status -ne 'Valid') {
            throw "BrainFuel.exe Authenticode signature is not valid. Status: $($signature.Status); Message: $($signature.StatusMessage)"
          }
          if ($null -eq $signature.SignerCertificate) {
            throw 'BrainFuel.exe has no signer certificate after signing.'
          }
      - name: Build Velopack installer and update feed
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH_RELEASE: ${{ needs.prepare.outputs.publish }}
        run: |
          if ($env:PUBLISH_RELEASE -eq 'true') {
            ./installer/build-velopack.ps1 -Version $env:BUILD_VERSION -Phase pack -DownloadPrevious
          } else {
            ./installer/build-velopack.ps1 -Version $env:BUILD_VERSION -Phase pack
          }
      - name: Sign Setup with Azure Artifact Signing
        if: steps.signing-mode.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\velopack\BrainFuel-win-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: BrainFuel
          description-url: https://brainfuel.jrtx.site/
      - name: Sign MSI with Azure Artifact Signing
        if: steps.signing-mode.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\velopack\BrainFuel-win-Setup.msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: BrainFuel
          description-url: https://brainfuel.jrtx.site/
      - name: Verify installer Authenticode signatures
        if: steps.signing-mode.outputs.enabled == 'true'
        shell: pwsh
        run: |
          foreach ($name in @('BrainFuel-win-Setup.exe', 'BrainFuel-win-Setup.msi')) {
            $path = Join-Path $pwd "dist\velopack\$name"
            $signature = Get-AuthenticodeSignature $path
            if ($signature.Status -ne 'Valid') {
              throw "$name Authenticode signature is not valid. Status: $($signature.Status); Message: $($signature.StatusMessage)"
            }
            if ($null -eq $signature.SignerCertificate) {
              throw "$name has no signer certificate after signing."
            }
          }
      - name: Verify Windows release artifacts
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISH_RELEASE: ${{ needs.prepare.outputs.publish }}
        run: |
          $required = @(
            "dist/velopack/BrainFuel-$env:BUILD_VERSION-full.nupkg",
            "dist/velopack/BrainFuel-win-Setup.exe",
            "dist/velopack/BrainFuel-win-Setup.msi",
            "dist/velopack/releases.win.json"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Required release artifact missing: $path" }
            if ((Get-Item $path).Length -le 0) { throw "Required release artifact is empty: $path" }
          }
          if ($env:PUBLISH_RELEASE -eq 'true') {
            $delta = Get-ChildItem dist/velopack -Filter "BrainFuel-$env:BUILD_VERSION-delta.nupkg" | Select-Object -First 1
            if (-not $delta) { throw "Published releases must include a delta package for $env:BUILD_VERSION" }
          }
      - name: Attest Windows build provenance
        uses: actions/attest@v4
        with:
          subject-path: dist/velopack/*
      - name: Upload updater artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-updater
          path: dist/velopack/*
          if-no-files-found: error

  publish-release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, portable, macos-native, windows-updater]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify complete release set
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          required=(
            "BrainFuel-windows-x64.zip"
            "BrainFuel-macos-arm64.zip"
            "BrainFuel-macos-arm64.dmg"
            "BrainFuel-macos-arm64.app.zip"
            "BrainFuel-linux-x64.zip"
            "BrainFuel-linux-x64.deb"
            "BrainFuel-win-Setup.exe"
            "BrainFuel-win-Setup.msi"
            "BrainFuel-${BUILD_VERSION}-full.nupkg"
            "BrainFuel-${BUILD_VERSION}-delta.nupkg"
            "releases.win.json"
          )
          for file in "${required[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "Required release asset missing or empty: $file" >&2
              exit 1
            fi
          done
      - name: Generate and verify SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
          test -s SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest checksum manifest
        uses: actions/attest@v4
        with:
          subject-path: release-assets/SHA256SUMS
      - name: Publish GitHub Release once
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          generate_release_notes: true
