name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Exact Rivet pin in release builds — the family policy (taskly): CI
  # may track upstream main, but releases ship from a commit the hosts
  # are verified against. Floating releases broke three ways in one day
  # (linux native-installer deps, windows copy semantics, swift codegen).
  # 410fc7c is rivet 0.6.1 — the same commit taskly and fulcrum ship; it
  # carries the linux-formats mechanism (deb/rpm/AppImage from
  # `raco rivet release`, upstream 2b4388c) the 0.2.0 release adopts.
  RIVET_COMMIT: 410fc7c6987cda5fcf4e4f795d1d4f7a90d4e0f6

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Version preflight (VERSION == rivet.rktd == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Check CHANGELOG has a section for this version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          grep -q "^## \[$TAG\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '[$TAG]' section"; exit 1; }

  macos:
    name: macOS package (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
            racket-arch: arm64
          - arch: x64
            runner: macos-15-intel
            racket-arch: x64
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Rivet (pinned)
        uses: actions/checkout@v7
        with:
          repository: turinglambdaai/rivet
          ref: ${{ env.RIVET_COMMIT }}
          path: rivet
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          version: stable
          distribution: full
      - name: Install crypto package (rivet/distribution dependency)
        run: raco pkg install --auto --no-docs crypto
        shell: bash
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
      - name: Version preflight (VERSION == rivet.rktd == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      # Launch smoke included (raco rivet package default): the packaged app
      # must survive launch on the packaging machine.
      - name: Package
        run: raco rivet package
      - name: Portable zip + DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist
          zip -qry "brainfuel-${VERSION}-macos-${{ matrix.arch }}.zip" brainfuel.app
          hdiutil create -volname "BrainFuel ${VERSION}" -srcfolder brainfuel.app -ov -format UDZO \
            "brainfuel-${VERSION}-macos-${{ matrix.arch }}.dmg"
          shasum -a 256 "brainfuel-${VERSION}-macos-${{ matrix.arch }}.zip" \
                        "brainfuel-${VERSION}-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/brainfuel-*-macos-*
          if-no-files-found: error

  windows:
    name: Windows package (x64)
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout Rivet (pinned)
        uses: actions/checkout@v7
        with:
          repository: turinglambdaai/rivet
          ref: ${{ env.RIVET_COMMIT }}
          path: rivet
      - name: Install Racket
        uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full
      - name: Install crypto package (rivet/distribution dependency)
        run: raco pkg install --auto --no-docs crypto
        shell: bash
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
        shell: bash
      - name: Install WiX (v5; v7 requires EULA acceptance, v5 runs the v4 schema)
        run: dotnet tool install --global wix --version 5.0.2
        shell: bash
      - name: Version preflight (VERSION == rivet.rktd == tag)
        shell: bash
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      - name: Package portable zip
        shell: pwsh
        run: raco rivet package --skip-launch-smoke
      - name: Zip portable build
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Compress-Archive -Path 'dist\brainfuel-windows-x64\*' -DestinationPath "brainfuel-$version-windows-x64.zip"
      - name: MSI (development-strength signing; production trust rides on a future update feed)
        env:
          # raco rivet release hard-requires the update environment to emit an
          # installer. The app has no update client yet, so the manifest it
          # produces is deleted below and never shipped — installers only.
          RIVET_UPDATE_BASE_URL: https://github.com/turinglambdaai/brainfuel/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: brainfuel-2026-10
          RIVET_UPDATE_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          # The release step re-packages; a stale package dir left by the zip
          # step above makes rivet's host build fail with "copy-file:
          # destination exists". Start from a clean dist — the zip lives in
          # the repo root and is not touched.
          rm -rf dist
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$RIVET_UPDATE_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          raco rivet release --development
          rm -f "$KEY_DER"
          rm -f dist/update-*.json
          # Move next to the zip so the artifact upload's shared glob root
          # sees both files (the msi is produced inside dist/).
          mv "dist/brainfuel-${GITHUB_REF_NAME#v}-windows-x64.msi" .
          test -f "brainfuel-${GITHUB_REF_NAME#v}-windows-x64.msi"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            brainfuel-*-windows-x64.msi
            brainfuel-*-windows-x64.zip
          if-no-files-found: error

  linux:
    name: Linux (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      # Build + cache the checksum-pinned embeddable Racket CS and export
      # the RIVET_RACKET_* embedding variables (family pipeline, taskly).
      - name: Set up embeddable Racket CS
        uses: turinglambdaai/rivet/.github/actions/setup-embed-racket@410fc7c6987cda5fcf4e4f795d1d4f7a90d4e0f6
      - name: Install crypto (rivet/distribution dependency) into the embeddable runtime
        run: raco pkg install --auto --no-docs crypto
      - name: Checkout Rivet (pinned)
        uses: actions/checkout@v7
        with:
          repository: turinglambdaai/rivet
          ref: ${{ env.RIVET_COMMIT }}
          path: rivet
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
      # libglib2.0-dev provides glib-compile-schemas for the AppImage
      # schema staging; rpm is the rpmbuild toolchain; desktop-file-utils
      # is the desktop entry validator the AppImage preflight requires.
      - name: Install GTK4, rpm and packaging tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev libglib2.0-dev rpm desktop-file-utils
      - name: Version preflight (VERSION == rivet.rktd == updater == tag)
        run: bash scripts/check-release-version.sh "${{ github.ref_name }}"
      # tar.gz (the update-feed payload) + deb + rpm + AppImage, launch
      # smoke included. The AppImage carries its own GTK4 dependency
      # closure; APPIMAGE_EXTRACT_AND_RUN lets appimagetool run on the
      # runner (development-strength signing, same as before).
      - name: Release (tar.gz + deb + rpm + AppImage)
        env:
          # raco rivet release hard-requires the update environment to emit an
          # installer. The manifest produced here is deleted below and never
          # shipped — the update feed is signed centrally in the publish job.
          RIVET_UPDATE_BASE_URL: https://github.com/turinglambdaai/brainfuel/releases/download/${{ github.ref_name }}
          RIVET_UPDATE_KEY_ID: brainfuel-2026-10
          RIVET_UPDATE_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          set -euo pipefail
          KEY_DER="$(mktemp -d)/update-ed25519-private.der"
          printf '%s' "$RIVET_UPDATE_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
          export RIVET_UPDATE_PRIVATE_KEY="$KEY_DER"
          raco rivet release --development
          rm -f "$KEY_DER"
          # rivet names every linux artifact brainfuel-<version>-linux-<arch>
          # with the arch spelled per ecosystem (tar.gz/AppImage-side x64 vs
          # deb amd64 vs rpm x86_64, which embeds the build number); verify
          # rather than rename. The rpm check is a glob: a no-match leaves
          # the pattern literal and ls fails the step.
          V="${GITHUB_REF_NAME#v}"
          ARCH="${{ matrix.arch }}"
          test -f "dist/brainfuel-${V}-linux-${ARCH}.tar.gz"
          case "$ARCH" in
            x64)   test -f "dist/brainfuel-${V}-linux-amd64.deb"
                   ls dist/brainfuel-${V}-*-linux-x86_64.rpm > /dev/null
                   test -f "dist/brainfuel-${V}-linux-x86_64.AppImage" ;;
            arm64) test -f "dist/brainfuel-${V}-linux-arm64.deb"
                   ls dist/brainfuel-${V}-*-linux-aarch64.rpm > /dev/null
                   test -f "dist/brainfuel-${V}-linux-aarch64.AppImage" ;;
          esac
          rm -f dist/update-*.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/brainfuel-*-linux-*
          if-no-files-found: error

  release:
    name: Publish
    # Single publish once every platform leg lands: the release only ever
    # exists with its complete asset set (site links + SHA256SUMS stay
    # valid from the first minute). The macOS runner pool can stall for
    # hours — accepted, fail-fast is off so one arch never kills the other.
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Racket CS
        uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          version: stable
          distribution: full
      - name: Install crypto package (rivet/distribution dependency)
        run: raco pkg install --auto --no-docs crypto
      - name: Checkout + link Rivet (release pin; the manifest signer)
        uses: actions/checkout@v7
        with:
          repository: turinglambdaai/rivet
          ref: ${{ env.RIVET_COMMIT }}
          path: rivet
      - name: Link Rivet
        run: raco pkg install --auto --no-docs --link "$GITHUB_WORKSPACE/rivet/rivet" "$GITHUB_WORKSPACE/rivet/rivet-cli"
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifact dirs
        run: |
          find dist -mindepth 2 -maxdepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -maxdepth 1 -type d -empty -delete
          ls -la dist/
      # The portable zips + linux tar.gz are the update feed (macOS/Windows
      # hosts swap them in place; Linux updates through the tar.gz). The
      # dmg/msi stay human installers, out of the feed. Missing secret →
      # warn and publish without a manifest (hosts then report
      # "manifest missing" on manual checks).
      - name: Sign the update feed
        env:
          UPDATE_ED25519_PRIVATE_KEY_B64: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          if [[ -n "${UPDATE_ED25519_PRIVATE_KEY_B64:-}" ]]; then
            KEY_DER="$RUNNER_TEMP/update-ed25519-private.der"
            printf '%s' "$UPDATE_ED25519_PRIVATE_KEY_B64" | base64 -d > "$KEY_DER"
            scripts/make-update-manifest.sh "$GITHUB_REF_NAME" dist "$KEY_DER"
          else
            echo "::warning::UPDATE_ED25519_PRIVATE_KEY_B64 not set — release ships without an update manifest"
          fi
      - name: Ensure SHA256SUMS
        run: |
          cd dist
          [ -f SHA256SUMS ] || {
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
          }
          shasum -a 256 --check SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" -R turinglambdaai/brainfuel >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/* --clobber -R turinglambdaai/brainfuel
          else
            gh release create "${{ github.ref_name }}" dist/* \
              -R turinglambdaai/brainfuel \
              --title "BrainFuel ${{ github.ref_name }}" \
              --generate-notes
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*
