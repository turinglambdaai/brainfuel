name: release

# Release model:
# - portable ZIPs remain available for users who do not want an installation;
# - Windows gets a Velopack installer plus full/delta update packages and feed;
# - all build jobs upload Actions artifacts, and one final job publishes the
#   GitHub Release to avoid concurrent jobs racing to mutate the same release.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   platform: windows-x64 }
          - { rid: osx-arm64, platform: macos-arm64 }
          - { rid: linux-x64, platform: linux-x64 }
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish portable (${{ matrix.rid }})
        run: >-
          dotnet publish BrainFuel.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -o publish

      - name: Package portable ZIP
        working-directory: publish
        run: zip -r "BrainFuel-${{ matrix.platform }}.zip" . -x '*.pdb'

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-portable-${{ matrix.platform }}
          path: publish/BrainFuel-${{ matrix.platform }}.zip
          if-no-files-found: error

  windows-updater:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            "DOWNLOAD_PREVIOUS=true" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            [xml]$project = Get-Content BrainFuel.csproj
            $version = $project.Project.PropertyGroup.Version | Select-Object -First 1
            "DOWNLOAD_PREVIOUS=false" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          "BUILD_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Packaging BrainFuel $version"

      - name: Build Velopack installer and update feed
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ($env:DOWNLOAD_PREVIOUS -eq 'true') {
            ./installer/build-velopack.ps1 -Version $env:BUILD_VERSION -DownloadPrevious
          } else {
            ./installer/build-velopack.ps1 -Version $env:BUILD_VERSION
          }

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-updater
          path: dist/velopack/*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [portable, windows-updater]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release once
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
