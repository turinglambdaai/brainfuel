name: release-v0.3.0

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   platform: windows-x64 }
          - { rid: osx-arm64, platform: macos-arm64 }
          - { rid: linux-x64, platform: linux-x64 }
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish portable (${{ matrix.rid }})
        run: >-
          dotnet publish BrainFuel.csproj -c Release -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:PublishTrimmed=false
          -o publish

      - name: Package portable ZIP
        working-directory: publish
        run: zip -r "BrainFuel-${{ matrix.platform }}.zip" . -x '*.pdb'

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-portable-${{ matrix.platform }}
          path: publish/BrainFuel-${{ matrix.platform }}.zip
          if-no-files-found: error

  windows-updater:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Velopack installer and update feed
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./installer/build-velopack.ps1 -Version 0.3.0

      - name: Upload updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-updater
          path: dist/velopack/*
          if-no-files-found: error

  publish-release:
    needs: [portable, windows-updater]
    runs-on: ubuntu-latest
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          target_commitish: ${{ github.sha }}
          files: release-assets/*
          generate_release_notes: true
