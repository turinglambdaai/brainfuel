name: CI
on:
  push:
  pull_request:

jobs:
  racket-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
      - name: Install rivet (upstream main)
        run: raco pkg install --auto --no-docs --skip-installed https://github.com/turinglambdaai/rivet.git
      - name: Domain core tests
        run: raco test racket/

  linux-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
      - name: Install rivet (upstream main)
        run: raco pkg install --auto --no-docs --skip-installed https://github.com/turinglambdaai/rivet.git
      - name: Install GTK4 development files
        run: |
          sudo apt-get update
          sudo apt-get install --yes libgtk-4-dev
      - name: Cache embedded Racket CS build
        id: cache-racket-embed
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/racket-embed
          key: racket-embed-9.3-linux-v1
      - name: Build full Racket CS 9.3 from pinned source
        if: steps.cache-racket-embed.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/racket-minimal-9.3-src-builtpkgs.tgz"
          source_root="$RUNNER_TEMP/racket-9.3"
          build_root="$RUNNER_TEMP/racket-embed-build"
          embed_prefix="$RUNNER_TEMP/racket-embed"

          curl --fail --location --retry 3 \
            --output "$archive" \
            https://download.racket-lang.org/releases/9.3/installers/racket-minimal-9.3-src-builtpkgs.tgz
          echo "3a01324d559a15e3f1f58b0c57a92bb344dce534e72e564e0d8b75e3b9c65295  $archive" |
            sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          mkdir -p "$build_root"
          cd "$build_root"
          "$source_root/src/configure" --prefix="$embed_prefix"
          make -j2
          make install
      - name: Build backend bundle and GTK4 host
        run: |
          set -euo pipefail
          echo "$RUNNER_TEMP/racket-embed/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/racket-embed/bin:$PATH"
          embed_prefix="$RUNNER_TEMP/racket-embed"

          # The minimal source build ships no cext-lib; raco ctool — which
          # compiles the backend bundle — lives there (it pulls compiler-lib).
          raco pkg install --auto --no-docs cext-lib

          racket_include="$(dirname "$(find "$embed_prefix" -name chezscheme.h -print -quit)")"
          racket_library="$(find "$embed_prefix" -name 'libracketcs*.a' -print -quit)"
          petite_boot="$(find "$embed_prefix" -name petite.boot -print -quit)"
          for artifact in "$racket_include" "$racket_library" "$petite_boot"; do
            if [[ -z "$artifact" ]]; then
              echo "embedded Racket CS artifact not found under $embed_prefix" >&2
              exit 1
            fi
          done
          export RIVET_RACKET_INCLUDE="$racket_include"
          export RIVET_RACKET_LIBRARY="$racket_library"
          export RIVET_RACKET_BOOT_DIR="$(dirname "$petite_boot")"

          raco rivet build

  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          architecture: x64
          distribution: full
          variant: CS
      - name: Install rivet (upstream main)
        run: raco pkg install --auto --no-docs --skip-installed https://github.com/turinglambdaai/rivet.git
      - name: Build backend bundle and WinUI3 host
        shell: pwsh
        run: raco rivet build
